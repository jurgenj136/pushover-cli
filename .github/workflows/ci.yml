name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format and generated artifacts
        run: |
          test -z "$(gofmt -l .)"
          scripts/check-generated.sh
      - name: Static analysis
        run: |
          go vet ./...
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run
      - name: Dependency and vulnerability review
        run: |
          go mod verify
          go list -m -json all > /dev/null
          go run github.com/google/go-licenses@v1.6.0 check ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Tests
        run: |
          go test ./...
          go test -race ./...
          go list ./... | xargs -n 1 go test -run=^$ -fuzz=Fuzz -fuzztime=5s
      - name: Release and skill contracts
        run: |
          scripts/check-release.sh
          scripts/validate-skill.sh

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...

  release-snapshot:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install verified Syft
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/syft"
          mkdir -p "$tool_dir"
          contract="${GITHUB_WORKSPACE}/internal/releasetest/testdata/release-contract.json"
          checksums_url=$(jq -r '.syft.checksums_url' "$contract")
          asset=$(jq -r '.syft.host_asset' "$contract" | sed "s/\${GOARCH}/$(go env GOARCH)/")
          cd "$tool_dir"
          curl --fail --location --silent --show-error --remote-name "$checksums_url"
          curl --fail --location --silent --show-error --remote-name "${checksums_url%/*}/$asset"
          grep " $asset$" syft_1.46.0_checksums.txt | shasum -a 256 -c -
          tar -xzf "$asset" syft
          chmod +x syft
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Build a release snapshot
        run: go run github.com/goreleaser/goreleaser/v2@v2.17.0 release --snapshot --clean
      - name: Check generated Homebrew formula
        shell: bash
        run: |
          set -euo pipefail
          brew ruby -e '
            require "formulary"
            path = Pathname.new("dist/homebrew/Formula/pushover.rb").expand_path
            formula = Formulary.from_contents("pushover", path, path.read)
            abort "generated formula has no test block" unless formula.test_defined?
          '
