name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate the release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]
          [[ "${GITHUB_REF_NAME}" =~ ^v0\.1\. ]]
      - id: contract
        name: Read the immutable release contract
        shell: bash
        run: |
          set -euo pipefail
          contract=internal/releasetest/testdata/release-contract.json
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'provenance_subjects<<EOF'
            jq -r '.provenance_subjects[]' "$contract"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          for id in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            key="${id//-/_}"
            echo "${key}_binary=$(jq -r --arg id "$id" '.archives[] | select(.id == $id) | .binary' "$contract")" >> "$GITHUB_OUTPUT"
            echo "${key}_sbom=$(jq -r --arg id "$id" --arg version "$version" '.archives[] | select(.id == $id) | .sbom | gsub("\\{\\{ \\.Version \\}\\}"; $version)' "$contract")" >> "$GITHUB_OUTPUT"
          done
      - name: Install verified Syft
        shell: bash
        run: |
          set -euo pipefail
          contract=internal/releasetest/testdata/release-contract.json
          checksums_url=$(jq -r '.syft.checksums_url' "$contract")
          asset=$(jq -r '.syft.host_asset' "$contract" | sed "s/\${GOARCH}/$(go env GOARCH)/")
          curl --fail --location --silent --show-error --remote-name "$checksums_url"
          curl --fail --location --silent --show-error --remote-name "${checksums_url%/*}/$asset"
          grep " $asset$" syft_1.46.0_checksums.txt | shasum -a 256 -c -
          tar -xzf "$asset" syft
          chmod +x syft
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Validate release inputs
        run: scripts/check-release.sh
      - name: Create release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest archives and checksums
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.provenance_subjects }}
      - name: Attest Darwin amd64 SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.darwin_amd64_binary }}
          sbom-path: ${{ steps.contract.outputs.darwin_amd64_sbom }}
      - name: Attest Darwin arm64 SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.darwin_arm64_binary }}
          sbom-path: ${{ steps.contract.outputs.darwin_arm64_sbom }}
      - name: Attest Linux amd64 SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.linux_amd64_binary }}
          sbom-path: ${{ steps.contract.outputs.linux_amd64_sbom }}
      - name: Attest Linux arm64 SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.linux_arm64_binary }}
          sbom-path: ${{ steps.contract.outputs.linux_arm64_sbom }}
      - name: Attest Windows amd64 SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.windows_amd64_binary }}
          sbom-path: ${{ steps.contract.outputs.windows_amd64_sbom }}
      - name: Attest Windows arm64 SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.contract.outputs.windows_arm64_binary }}
          sbom-path: ${{ steps.contract.outputs.windows_arm64_sbom }}
